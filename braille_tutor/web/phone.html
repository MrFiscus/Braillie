<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braillie phone camera</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><path d=%22M32 13V9%22 stroke=%22%23121212%22 stroke-width=%224%22 stroke-linecap=%22round%22/><circle cx=%2232%22 cy=%227%22 r=%224.5%22 fill=%22%23ffd60a%22 stroke=%22%23121212%22 stroke-width=%223%22/><rect x=%229%22 y=%2214%22 width=%2246%22 height=%2247%22 rx=%2222%22 fill=%22%23ffd60a%22 stroke=%22%23121212%22 stroke-width=%224%22/><circle cx=%2224%22 cy=%2233%22 r=%225.5%22 fill=%22%23121212%22/><circle cx=%2240%22 cy=%2233%22 r=%225.5%22 fill=%22%23121212%22/><circle cx=%2225.8%22 cy=%2231%22 r=%221.8%22 fill=%22%23fff%22/><circle cx=%2241.8%22 cy=%2231%22 r=%221.8%22 fill=%22%23fff%22/><path d=%22M25 44c4 5 10 5 14 0%22 fill=%22none%22 stroke=%22%23121212%22 stroke-width=%223.5%22 stroke-linecap=%22round%22/></svg>">
<style>
  /* The same look as the Braillie website: Braillo, big type, one bright accent, round keys. The colours are the laptop page's own
     (the tutor sends its theme with every reply, and sets data-theme below); until then, the phone's own light or dark. */
  :root { color-scheme: dark; --bg: #0a0a0b; --card: #18191b; --fg: #fff; --soft: #d9d9db; --accent: #ffd60a; --on-accent: #000;
          --ok: #7cf2a8; --bad: #ff8a80; --bw: 3px; }
  @media (prefers-color-scheme: light) { :root:not([data-theme]) { color-scheme: light; --bg: #fff; --card: #f4f4f5; --fg: #0a0a0b;
                                                 --soft: #2e2f31; --accent: #0b3ab0; --on-accent: #fff; --ok: #0b5323; --bad: #b3261e; } }
  :root[data-theme="light"] { color-scheme: light; --bg: #fff; --card: #f4f4f5; --fg: #0a0a0b; --soft: #2e2f31; --accent: #0b3ab0;
                              --on-accent: #fff; --ok: #0b5323; --bad: #b3261e; }
  :root[data-theme="contrast-light"] { color-scheme: light; --bg: #fff; --card: #fff; --fg: #000; --soft: #000; --accent: #0822a8;
                                       --on-accent: #fff; --ok: #00461a; --bad: #8c0000; --bw: 4px; }
  :root[data-theme="contrast"] { color-scheme: dark; --bg: #000; --card: #000; --fg: #fff; --soft: #fff; --accent: #ffe14d;
                                 --on-accent: #000; --ok: #7cffb2; --bad: #ff9e9e; --bw: 4px; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif; }
  main { max-width: 34rem; min-height: 100svh; margin: 0 auto; padding: 1rem 16px 2rem; box-sizing: border-box;
         display: flex; flex-direction: column; align-items: center; gap: 1.25rem; text-align: center; }
  .brand { align-self: flex-start; margin: 0; font-size: 1.35rem; font-weight: 800; }
  .brand span { color: var(--accent); }
  .braillo { width: min(11rem, 42vw); height: auto; overflow: visible; margin-top: 0.5rem; }
  #status { margin: 0; font-size: 1.65rem; line-height: 1.3; font-weight: 700; min-height: 4.4rem; max-width: 26ch; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  button { font: inherit; cursor: pointer; }
  /* the one thing to press: a big round key with its word under it */
  .key { display: grid; justify-items: center; gap: 0.6rem; padding: 0; border: 0; background: none; color: var(--fg);
         font-size: 1.4rem; font-weight: 800; }
  .key__disc { display: grid; place-items: center; width: 8.5rem; aspect-ratio: 1; border-radius: 50%; background: var(--accent);
               color: var(--on-accent); border: var(--bw) solid var(--accent); }
  .key--small .key__disc { width: 5rem; background: var(--bg); color: var(--fg); border-color: var(--fg); }
  .key svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .key:active .key__disc { transform: scale(0.96); }
  #go .key__disc { box-shadow: 0 0 0 0 var(--accent); animation: ring 1.8s ease-out infinite; }
  form { width: 100%; display: grid; gap: 0.9rem; }
  label { font-size: 1.35rem; font-weight: 700; }
  input { font: inherit; font-size: 2.4rem; font-weight: 800; letter-spacing: .35em; text-align: center; padding: .7rem; width: 100%;
          box-sizing: border-box; border-radius: 1rem; border: var(--bw) solid var(--fg); background: var(--card); color: var(--fg); }
  .wide { font-size: 1.5rem; font-weight: 800; min-height: 4.75rem; border-radius: 1rem; border: var(--bw) solid var(--accent);
          background: var(--accent); color: var(--on-accent); }
  video { width: 100%; max-height: 38vh; object-fit: cover; border-radius: 1.25rem; background: #000; border: var(--bw) solid var(--accent); }
  #help { font-size: 1.15rem; line-height: 1.45; margin: 0; color: var(--soft); max-width: 30ch; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; border-radius: 1rem; }
  .key:focus-visible { outline: none; }
  .key:focus-visible .key__disc { outline: 4px solid var(--fg); outline-offset: 5px; }
  .b-heard { stroke: var(--accent); }
  /* Braillo: his mouth moves while the tutor's voice plays here, a hand goes to his ear while the microphone is on */
  .b-mouth, .b-arm-up, .b-heard { display: none; }
  .braillo[data-state="speaking"] .b-smile { display: none; }
  .braillo[data-state="speaking"] .b-mouth { display: inline; animation: talk 300ms ease-in-out infinite alternate; }
  .braillo[data-state="listening"] .b-arm-down { display: none; }
  .braillo[data-state="listening"] .b-arm-up, .braillo[data-state="listening"] .b-heard { display: inline; }
  .braillo[data-state="listening"] .b-heard { animation: hear 1.3s ease-in-out infinite; }
  .b-mouth, .b-eyes { transform-box: fill-box; transform-origin: center; }
  .b-eyes { animation: blink 5s ease-in-out infinite; }
  @keyframes talk { from { transform: scaleY(0.35); } to { transform: scaleY(1.05); } }
  @keyframes hear { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); } 100% { box-shadow: 0 0 0 1.4rem transparent; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
<main>
  <p class="brand">Braillie<span>.</span></p>

  <!-- Braillo, the tutor (a picture: the status line under him says everything in words) -->
  <svg id="braillo" class="braillo" data-state="idle" viewBox="0 0 220 260" aria-hidden="true" focusable="false">
    <ellipse cx="110" cy="246" rx="58" ry="8" fill="currentColor" opacity="0.18"/>
    <circle cx="110" cy="20" r="17" fill="#ffd60a" opacity="0.3"/>
    <path d="M110 44V30" stroke="#121212" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="110" cy="20" r="10" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <g class="b-heard" fill="none" stroke="#ffd60a" stroke-width="6" stroke-linecap="round"><path d="M204 88c5 6 5 16 0 22"/><path d="M214 80c9 11 9 27 0 38"/></g>
    <g fill="none" stroke-linecap="round">
      <path d="M52 128c-16 8-24 24-22 40" stroke="#121212" stroke-width="15"/><path d="M52 128c-16 8-24 24-22 40" stroke="#ffd60a" stroke-width="6.5"/>
      <g class="b-arm-down"><path d="M168 128c16 8 24 24 22 40" stroke="#121212" stroke-width="15"/><path d="M168 128c16 8 24 24 22 40" stroke="#ffd60a" stroke-width="6.5"/></g>
      <g class="b-arm-up"><path d="M168 128c12-4 18-14 18-26" stroke="#121212" stroke-width="15"/><path d="M168 128c12-4 18-14 18-26" stroke="#ffd60a" stroke-width="6.5"/></g>
    </g>
    <circle cx="31" cy="171" r="11" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <circle class="b-arm-down" cx="189" cy="171" r="11" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <circle class="b-arm-up" cx="187" cy="99" r="10" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <rect x="72" y="214" width="30" height="20" rx="10" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <rect x="118" y="214" width="30" height="20" rx="10" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <rect x="44" y="40" width="132" height="184" rx="62" fill="#ffd60a" stroke="#121212" stroke-width="4.5"/>
    <ellipse cx="78" cy="78" rx="18" ry="10" transform="rotate(-30 78 78)" fill="#fff" opacity="0.45"/>
    <path d="M72 84c6-5 14-5 20 0M128 84c6-5 14-5 20 0" fill="none" stroke="#121212" stroke-width="4.5" stroke-linecap="round"/>
    <g class="b-eyes"><circle cx="84" cy="106" r="12" fill="#121212"/><circle cx="136" cy="106" r="12" fill="#121212"/>
      <circle cx="88" cy="101" r="4" fill="#fff"/><circle cx="140" cy="101" r="4" fill="#fff"/></g>
    <ellipse cx="68" cy="128" rx="10" ry="6" fill="#ff8fa3" opacity="0.7"/><ellipse cx="152" cy="128" rx="10" ry="6" fill="#ff8fa3" opacity="0.7"/>
    <path class="b-smile" d="M96 128c8 10 20 10 28 0" fill="none" stroke="#121212" stroke-width="4.5" stroke-linecap="round"/>
    <g class="b-mouth"><path d="M94 126h32c0 14-7 22-16 22s-16-8-16-22z" fill="#121212"/><ellipse cx="110" cy="142" rx="8" ry="4.5" fill="#ff6b81"/></g>
    <circle cx="88" cy="168" r="8" fill="#121212"/><circle cx="132" cy="168" r="7" fill="none" stroke="#121212" stroke-width="3.5"/>
    <circle cx="88" cy="196" r="7" fill="none" stroke="#121212" stroke-width="3.5"/><circle cx="132" cy="196" r="8" fill="#121212"/>
  </svg>

  <h1 class="sr-only">Braillie phone camera</h1>
  <p id="status" role="status" aria-live="assertive">Getting ready.</p>

  <form id="codeform" hidden>
    <label for="code">The code on the laptop</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" aria-describedby="status">
    <button type="submit" class="wide">Connect</button>
  </form>

  <button id="go" class="key" hidden aria-label="Start the camera and the sound">
    <span class="key__disc"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg></span>
    <span id="go-label">Start</span>
  </button>
  <audio id="voice" playsinline hidden></audio>
  <video id="preview" playsinline muted autoplay hidden aria-hidden="true"></video>
  <p id="help" hidden>Hold the phone flat above the page, about 30 cm up, with the whole sheet in view. Keep this screen open.</p>
  <button id="stop" class="key key--small" hidden aria-label="Stop the camera">
    <span class="key__disc"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></span>
    <span>Stop</span>
  </button>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), video = $("preview"), braillo = $("braillo");
let code = new URLSearchParams(location.search).get("t") || "";
let stream = null, running = false, wake = null;
let lastSpoken = "", lastSpokenAt = 0, pageOk = null, pageBadSince = 0, lastNag = 0;
let soundOn = false, clipPlaying = false;
let playingClip = 0, hushedClip = 0, stopClip = null;   // the clip playing now, the last one the learner cut off, and how to stop it
let nagGap = 12000;                                    // "cannot see the page" comes round less and less often while nothing changes
let micCtx = null, micStream = null, micOn = false;   // the phone's microphone, sent to the laptop for the spoken commands
const MIC_RATE = 16000;                               // what the laptop's speech recognition expects: 16 kHz, mono, 16-bit
const micPending = [];
const handledClips = new Set();
// a tenth of a second of silence: playing it inside the tap is what lets the page play the tutor's voice later (phones block sound until then)
const SILENCE = "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// On the backup link (the tunnel, over the internet) the frames go smaller: about a third of the size, still plenty to read the dots,
// so a slow connection keeps up.
const overInternet = location.hostname.endsWith(".trycloudflare.com");

// Tell the laptop what this browser says, so a phone that "does not work" can be diagnosed from the laptop's terminal.
function report(event, detail) {
  if (!code) return;
  try {
    fetch("/phone/log?t=" + encodeURIComponent(code), { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify({ event, detail: String(detail || "").slice(0, 200) }) }).catch(() => {});
  } catch (e) { /* nothing more to do */ }
}

// Braillo shows what the voice is doing: talking while a clip plays here, a hand to his ear while the microphone is on.
function showBraillo() {
  braillo.dataset.state = clipPlaying ? "speaking" : micOn ? "listening" : "idle";
}

// The laptop page's colours, so both screens look the same ("light", "dark", "contrast-light" or "contrast").
const THEMES = ["light", "dark", "contrast-light", "contrast"];
function setTheme(theme) {
  if (THEMES.includes(theme) && document.documentElement.dataset.theme !== theme) document.documentElement.dataset.theme = theme;
}

// The big key's word (and what a screen reader calls it).
function setGo(text) {
  $("go-label").textContent = text;
  $("go").setAttribute("aria-label", text);
}

function say(text, tone) {
  statusEl.textContent = text;            // read by VoiceOver / TalkBack through aria-live
  statusEl.className = tone || "";
  const now = Date.now();
  if (text === lastSpoken && now - lastSpokenAt < 8000) return;
  lastSpoken = text; lastSpokenAt = now;
  try {                                   // also spoken by the phone itself (iOS only allows this after a tap, so it may stay silent until then)
    if ("speechSynthesis" in window && !clipPlaying) {
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }
  } catch (e) { /* the text above is still there */ }
}

const voice = $("voice");

// iPhone's sound mode: "playback" plays even with the silent switch on, but does not allow a microphone ("AudioSession category is not
// compatible with audio capture"); "play-and-record" allows both, and plays from the loudspeaker as a web call does.
function setAudioSession(type) {
  try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) { /* not this browser */ }
}

// Must be called straight from a tap (before any await): starts the silent clip that unlocks sound for the whole page.
function unlockAudio() {
  try {
    setAudioSession("playback");   // iPhone: play even with the ring/silent switch on (until the microphone starts, see start())
    prepareMic();
    voice.src = SILENCE;
    return voice.play().then(() => { soundOn = true; }).catch((e) => { soundOn = false; report("sound-error", `${e && e.name}: ${e && e.message}`); });
  } catch (e) {
    report("sound-error", String(e));
    return Promise.resolve();
  }
}

function clipUrl(path, id, extra) {
  return `${path}?t=${encodeURIComponent(code)}&id=${id}${extra || ""}`;
}

// Where a WAV's samples start, and their format, read from its start (its sizes are not used: a line still being made claims hours).
function wavFormat(bytes) {
  const v = new DataView(bytes.buffer, bytes.byteOffset, bytes.length);
  const tag = (at) => String.fromCharCode(bytes[at], bytes[at + 1], bytes[at + 2], bytes[at + 3]);
  if (bytes.length < 12 || tag(0) !== "RIFF" || tag(8) !== "WAVE") return null;
  let at = 12, fmt = null;
  while (at + 8 <= bytes.length) {
    const kind = tag(at), size = v.getUint32(at + 4, true);
    if (kind === "fmt ") {
      if (at + 24 > bytes.length) return null;
      fmt = { channels: v.getUint16(at + 10, true), rate: v.getUint32(at + 12, true), bits: v.getUint16(at + 22, true) };
    } else if (kind === "data") {
      return fmt && fmt.bits === 16 ? { ...fmt, start: at + 8 } : null;
    }
    at += 8 + size + (size & 1);
  }
  return null;
}

// A whole WAV with its sizes put right (for the <audio> element, which trusts them).
function repairedWav(buffer) {
  const bytes = new Uint8Array(buffer), fmt = wavFormat(bytes);
  if (!fmt) return buffer;
  const v = new DataView(buffer);
  v.setUint32(4, bytes.length - 8, true);
  v.setUint32(fmt.start - 4, bytes.length - fmt.start, true);
  return buffer;
}

const PLAY_AHEAD = 0.25;   // seconds of a streamed line gathered before it starts, so a slow moment on the Wi-Fi does not stutter

// Play speech that is still arriving: each piece is scheduled straight after the one before, so it sounds like one line, and it starts
// within a moment instead of after the whole line has been made. Resolves when all of it has played (or it was stopped).
function playStreamed(res, clip, onStart, setStop) {
  return new Promise(async (resolve, reject) => {
    const ctx = micCtx;
    try { await ctx.resume(); } catch (e) { /* it was unlocked by the tap */ }
    const reader = res.body.getReader();
    let pending = new Uint8Array(0), fmt = null, next = 0, live = 0, ended = false, stopped = false, started = false;
    // The voice's own rate (24 kHz) is turned into the phone's (usually 48 kHz) here, smoothly across pieces: left to the browser, each
    // piece is converted on its own, and the joins click (heard as crackling in the quiet between sentences).
    let prev = 0, t = 0;
    const sources = new Set();
    const settle = () => { if (ended && !live) resolve(); };
    setStop(() => {
      stopped = true;
      sources.forEach((s) => { try { s.stop(); } catch (e) { /* done already */ } });
      try { reader.cancel(); } catch (e) { /* none */ }
      resolve();
    });
    const schedule = (final) => {
      const frame = fmt.channels * 2;
      const minimum = final ? frame : Math.round(fmt.rate * (started ? 0.1 : PLAY_AHEAD)) * frame;
      const usable = pending.length - (pending.length % frame);
      if (usable < minimum || !usable) return;
      const frames = usable / frame, view = new DataView(pending.buffer, pending.byteOffset, usable);
      const input = new Float32Array(frames);   // (mono: the voice is one channel; more are mixed down)
      for (let i = 0; i < frames; i++) {
        let sum = 0;
        for (let c = 0; c < fmt.channels; c++) sum += view.getInt16((i * fmt.channels + c) * 2, true);
        input[i] = sum / fmt.channels / 32768;
      }
      pending = pending.slice(usable);
      // linear interpolation, carrying the last sample and the position over from the piece before, so the joins are seamless
      const step = fmt.rate / ctx.sampleRate, samples = [];
      while (t < frames) {
        const i = Math.floor(t), f = t - i;
        const a = i === 0 ? prev : input[i - 1], b = input[i];
        samples.push(a + (b - a) * f);
        t += step;
      }
      t -= frames;
      prev = input[frames - 1];
      if (!samples.length) return;
      const buffer = ctx.createBuffer(1, samples.length, ctx.sampleRate);
      buffer.getChannelData(0).set(samples);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(ctx.destination);
      if (next < ctx.currentTime + 0.02) next = ctx.currentTime + 0.05;   // (the first piece, or the Wi-Fi fell behind)
      src.start(next);
      if (!started) { started = true; setTimeout(onStart, Math.max(0, (next - ctx.currentTime) * 1000)); }
      next += buffer.duration;
      sources.add(src); live += 1;
      src.onended = () => { sources.delete(src); live -= 1; settle(); };
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (stopped) return;
        if (done) break;
        const joined = new Uint8Array(pending.length + value.length);
        joined.set(pending); joined.set(value, pending.length);
        pending = joined;
        if (!fmt) {
          fmt = wavFormat(pending);
          if (!fmt) continue;
          pending = pending.slice(fmt.start);
        }
        schedule(false);
      }
      if (fmt) schedule(true);
      ended = true;
      settle();
    } catch (e) {
      if (!stopped) reject(e);
    }
  });
}

// The laptop made some speech and sent it here: fetch it, play it, tell the laptop when it has finished (it waits, so lines never overlap).
async function playClip(clip) {
  if (handledClips.has(clip.id)) return;
  handledClips.add(clip.id);
  clipPlaying = true;
  showBraillo();
  try { speechSynthesis.cancel(); } catch (e) { /* none */ }
  let done = false;
  const finish = (error) => {
    if (done) return;
    done = true;
    clipPlaying = false;
    showBraillo();
    if (stopClip === stop) stopClip = null;
    fetch(clipUrl("/phone/audio-done", clip.id, error ? "&error=" + encodeURIComponent(error) : ""), { method: "POST" }).catch(() => {});
  };
  const started = () => fetch(clipUrl("/phone/audio-start", clip.id), { method: "POST" }).catch(() => {});   // the captions follow from now
  let url = "";
  let stop = () => { try { voice.pause(); } catch (e) { /* none */ } if (url) URL.revokeObjectURL(url); finish(""); };
  stopClip = stop;
  playingClip = clip.id;
  try {
    const res = await fetch(clipUrl("/phone/audio", clip.id), { cache: "no-store" });
    if (!res.ok) throw new Error("fetch " + res.status);
    if (hushedClip >= clip.id) return finish("");   // cut off while it was on its way
    if (clip.type === "audio/wav" && micCtx && res.body && res.body.getReader) {
      await playStreamed(res, clip, started, (fn) => { stop = () => { fn(); finish(""); }; stopClip = stop; });
      return finish("");
    }
    const body = clip.type === "audio/wav" ? new Blob([repairedWav(await res.arrayBuffer())], { type: clip.type }) : await res.blob();
    url = URL.createObjectURL(body);
    voice.onplaying = () => {   // it is audible now: the laptop times the captions from this moment (fetching it took a moment)
      voice.onplaying = null;
      started();
    };
    voice.onended = () => { URL.revokeObjectURL(url); finish(""); };
    voice.onerror = () => { URL.revokeObjectURL(url); finish("decode"); };
    voice.src = url;
    await voice.play();
  } catch (e) {
    finish(`${e && e.name}: ${e && e.message}`.slice(0, 60));
  }
}

// The learner talked over the tutor: the laptop says which clip to stop.
function hush(id) {
  if (!id || id <= hushedClip) return;
  hushedClip = id;
  if (playingClip === id && stopClip) stopClip();
}

// Called straight from the tap, with unlockAudio(): phones only let a page start audio inside a tap.
function prepareMic() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx && !micCtx) { micCtx = new Ctx(); micCtx.resume(); }
  } catch (e) { report("mic-error", "audio context: " + e); }
}

// Average groups of input samples down to 16 kHz (the browser's own rate is 44.1 or 48 kHz), as signed 16-bit numbers.
function makeDownsampler(inRate) {
  const ratio = inRate / MIC_RATE;
  let sum = 0, n = 0, edge = ratio, i = 0;
  return (input, out) => {
    for (let k = 0; k < input.length; k++) {
      sum += input[k]; n += 1; i += 1;
      if (i >= edge) {
        const v = Math.max(-1, Math.min(1, sum / n));
        out.push(v < 0 ? v * 0x8000 : v * 0x7fff);
        sum = 0; n = 0; edge += ratio;
      }
    }
  };
}

const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor("mic-tap", Tap);`;

async function startMic(audioTracks) {
  if (!micCtx || !audioTracks.length) { report("mic-error", "no microphone track"); return; }
  micStream = new MediaStream(audioTracks);
  await micCtx.resume();
  const source = micCtx.createMediaStreamSource(micStream);
  const down = makeDownsampler(micCtx.sampleRate);
  const silent = micCtx.createGain(); silent.gain.value = 0; silent.connect(micCtx.destination);   // (some browsers only run a node that reaches the output)
  let how = "worklet";
  try {
    if (!micCtx.audioWorklet) throw new Error("no AudioWorklet");
    await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
    const node = new AudioWorkletNode(micCtx, "mic-tap");
    node.port.onmessage = (e) => down(e.data, micPending);
    source.connect(node); node.connect(silent);
  } catch (e) {                                    // older browsers
    how = "script-processor";
    const node = micCtx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = (e) => down(e.inputBuffer.getChannelData(0), micPending);
    source.connect(node); node.connect(silent);
  }
  micOn = true;
  showBraillo();
  report("mic-started", `${micCtx.sampleRate} Hz via ${how}`);
  micSendLoop();
}

async function micSendLoop() {
  while (running && micOn) {
    await sleep(200);
    if (micPending.length > 2 * MIC_RATE) micPending.splice(0, micPending.length - MIC_RATE);   // far behind: keep only the last second
    if (!micPending.length) continue;
    const pcm = new Int16Array(micPending.splice(0, micPending.length));
    try {
      await fetch("/phone/mic?t=" + encodeURIComponent(code), { method: "POST", body: pcm.buffer, headers: { "Content-Type": "application/octet-stream" } });
    } catch (e) { /* real time: a lost chunk is just dropped */ }
  }
}

async function verify() {
  try {
    const res = await fetch("/phone/check?t=" + encodeURIComponent(code), { cache: "no-store" });
    if (res.ok) setTheme((await res.json().catch(() => ({}))).theme);
    return res.ok;
  } catch (e) {
    say("I cannot reach the laptop. Check that the phone and the laptop are on the same Wi-Fi.", "bad");
    return null;
  }
}

async function begin(unlocked) {
  if (!code) { $("codeform").hidden = false; $("go").hidden = true; say("Enter the 6 digit code shown on the laptop."); $("code").focus(); return; }
  $("codeform").hidden = true;
  const ok = await verify();
  if (ok === null) { $("go").hidden = false; setGo("Try again"); return; }
  if (!ok) { code = ""; $("codeform").hidden = false; say("That code is not right. Enter the 6 digit code shown on the laptop.", "bad"); $("code").focus(); return; }
  if (unlocked) await unlocked;   // (already started inside the tap; here only to know how it went)
  report("page-loaded", `secure=${window.isSecureContext} cameraApi=${!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)} ${navigator.userAgent}`);
  await start();
}

function videoConstraints() {
  return { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } };
}

// Sharper pages: keep focusing, and light the desk where the phone can.
async function applyTrackPreferences(track) {
  try {
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    const advanced = [];
    if (caps.focusMode && caps.focusMode.includes("continuous")) advanced.push({ focusMode: "continuous" });
    if (caps.torch) advanced.push({ torch: true });
    if (advanced.length) await track.applyConstraints({ advanced });
  } catch (e) { /* not supported here: fine */ }
}

async function start() {
  $("go").hidden = true;
  say("Starting the camera. If your phone asks, allow camera access.");
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    report("camera-error", `no camera API here (secure context: ${window.isSecureContext})`);
    say("This browser will not let the page use the camera. On an iPhone use Safari; on Android use Chrome. If you were shown a privacy warning, choose Advanced, then continue.", "bad");
    $("go").hidden = false; setGo("Try again");
    return;
  }
  try {
    try {           // camera and microphone in one prompt...
      setAudioSession("play-and-record");
      stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(),
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (first) {   // ...and if the microphone is the problem, the camera alone still works (the laptop's microphone is used)
      report("mic-error", `${first && first.name}: ${first && first.message}`);
      setAudioSession("playback");
      stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(), audio: false });
    }
  } catch (e) {
    report("camera-error", `${e && e.name}: ${e && e.message}`);
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    say(denied ? "The camera is blocked. Allow the camera for this page in your browser settings, then reload the page."
               : "I could not start the camera. Close other apps that use it and try again.", "bad");
    $("go").hidden = false; setGo("Try again");
    return;
  }
  video.srcObject = stream;
  video.hidden = false; $("help").hidden = false; $("stop").hidden = false;
  await video.play().catch(() => {});
  await applyTrackPreferences(stream.getVideoTracks()[0]);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) { /* screen may sleep: nothing to do */ }
  running = true;
  const audioTracks = stream.getAudioTracks();
  if (audioTracks.length) { try { await startMic(audioTracks); } catch (e) { report("mic-error", String(e)); setAudioSession("playback"); } }
  if (soundOn) fetch("/phone/audio-ready?t=" + encodeURIComponent(code), { method: "POST" }).catch(() => {});  // from now on the laptop sends its voice here
  report("camera-started", `${video.videoWidth}x${video.videoHeight}` + (soundOn ? " sound=on" : " sound=off") + (micOn ? " mic=on" : " mic=off"));
  say(soundOn
      ? (micOn ? "Camera, sound and microphone on. You will hear the tutor on this phone, and you can speak to it here."
               : "Camera and sound on. You will hear the tutor on this phone. The microphone is off here, so speak to the laptop.")
      : "Camera on. Sending to the laptop. The sound is off on this phone, so the laptop will speak.", "ok");
  lastVideoTime = -1; stallSince = 0; restarting = false; restartFailures = 0;   // fresh stall-tracking for this camera session
  loop();
}

function announce(info) {
  const now = Date.now();
  if (info.page_ok) {
    if (pageOk !== true) say("Page found. You are ready.", "ok");
    pageOk = true; pageBadSince = 0; nagGap = 12000;
  } else {
    if (pageOk !== false) { pageOk = false; pageBadSince = now; lastNag = now; }
    if (now - pageBadSince > 4000 && now - lastNag > nagGap) {   // nag gently: 12 s, then 24, 48, ... up to every 2 minutes
      lastNag = now;
      nagGap = Math.min(nagGap * 2, 120000);
      say("I cannot see the page yet. Hold the phone higher and keep the whole sheet in view.", "bad");
    }
  }
}

// A <video> element's own decode clock can silently stop advancing (seen on iOS Safari: after the
// screen dims, the app backgrounds briefly, or under camera/thermal contention) while
// getUserMedia's track still reports "live". Nothing else notices: drawImage() keeps drawing the
// same last-decoded picture, and the loop below would otherwise upload that one dead frame 8x a
// second forever, with the laptop unable to tell a genuinely still page from a frozen video.
let lastVideoTime = -1, stallSince = 0, restarting = false, restartFailures = 0;
const STALL_MS_TO_RESTART = 1800;    // this long with currentTime not moving is a freeze, not a slow tick
const MAX_RESTART_FAILURES = 3;      // after this many failed restarts in a row, stop hammering getUserMedia

async function restartCamera() {
  const oldVideoTrack = stream && stream.getVideoTracks()[0];
  try {
    const fresh = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(), audio: false });
    const newVideoTrack = fresh.getVideoTracks()[0];
    const audioTracks = (stream && stream.getAudioTracks()) || [];
    stream = new MediaStream([newVideoTrack, ...audioTracks]);
    video.srcObject = stream;
    await video.play().catch(() => {});
    await applyTrackPreferences(newVideoTrack);
    if (oldVideoTrack) { try { oldVideoTrack.stop(); } catch (e) { /* already gone */ } }
    report("camera-restarted", `${video.videoWidth}x${video.videoHeight}`);
    restartFailures = 0;
    return true;
  } catch (e) {
    restartFailures += 1;
    report("camera-restart-failed", `${e && e.name}: ${e && e.message} (attempt ${restartFailures})`);
    if (restartFailures >= MAX_RESTART_FAILURES) {
      say("The camera froze and could not restart. Reload this page.", "bad");
    }
    return false;
  }
}

async function loop() {
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d");
  let failures = 0;
  while (running) {
    const t0 = performance.now();
    if (video.videoWidth) {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        stallSince = 0;
      } else if (!stallSince) {
        stallSince = t0;
      }
      if (stallSince && t0 - stallSince >= STALL_MS_TO_RESTART && !restarting && restartFailures < MAX_RESTART_FAILURES) {
        restarting = true;
        report("camera-stalled", `video.currentTime stuck at ${video.currentTime.toFixed(2)}s`);
        say("The camera froze. Restarting it…", "bad");
        const ok = await restartCamera();
        lastVideoTime = -1; stallSince = 0; restarting = false;
        if (ok) { await sleep(200); }   // give the fresh stream a moment before drawing from it
        continue;
      }
      const s = Math.min(1, (overInternet ? 960 : 1280) / Math.max(video.videoWidth, video.videoHeight));
      canvas.width = Math.round(video.videoWidth * s); canvas.height = Math.round(video.videoHeight * s);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", overInternet ? 0.6 : 0.8));
      try {
        const res = await fetch("/phone/frame?t=" + encodeURIComponent(code),
                                { method: "POST", body: blob, headers: { "Content-Type": "image/jpeg" } });
        if (res.status === 403) { halt(); say("The laptop did not accept this phone. Reload the page and scan the code again.", "bad"); return; }
        if (!res.ok) throw new Error("bad reply " + res.status);
        const info = await res.json();
        setTheme(info.theme);
        announce(info);
        hush(info.hush);
        if (info.say && soundOn) playClip(info.say);   // (not awaited: the camera keeps streaming while it talks)
        if (failures >= 5) say("Connected again.", "ok");
        failures = 0;
      } catch (e) {
        failures += 1;
        if (failures === 5) say("Lost the connection to the laptop. Check that both are on the same Wi-Fi.", "bad");
        if (failures === 1) console.warn("upload failed", e);
        await sleep(500);
      }
    }
    await sleep(Math.max(0, 120 - (performance.now() - t0)));   // about 8 frames a second is plenty for reading a page
  }
}

function halt() {
  running = false;
  micOn = false;
  showBraillo();
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  if (wake) { try { wake.release(); } catch (e) { /* ignore */ } wake = null; }
}

$("stop").addEventListener("click", () => { halt(); try { voice.pause(); } catch (e) { /* none */ } video.hidden = true; $("stop").hidden = true; $("help").hidden = true;
                                              $("go").hidden = false; setGo("Start again"); say("Camera stopped."); });
$("go").addEventListener("click", () => { const unlocked = unlockAudio(); begin(unlocked); });
$("codeform").addEventListener("submit", (e) => { e.preventDefault(); code = $("code").value.trim(); const unlocked = unlockAudio(); begin(unlocked); });
document.addEventListener("visibilitychange", async () => {   // a phone that was locked or switched away needs the screen lock again
  if (document.visibilityState === "visible" && running && navigator.wakeLock && !wake) {
    try { wake = await navigator.wakeLock.request("screen"); } catch (e) { /* ignore */ }
  }
});
window.addEventListener("pagehide", halt);

if (code) {   // sound can only be unlocked by a tap, so wait for one (one big button; the camera starts with it)
  $("go").hidden = false;
  say("Tap Start to turn on the camera and the sound.");
  $("go").focus();
} else { $("codeform").hidden = false; say("Enter the 6 digit code shown on the laptop."); $("code").focus(); }
</script>
</body>
</html>
